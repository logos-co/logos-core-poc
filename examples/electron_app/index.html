<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Logos Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden; /* Prevent body scrolling */
            display: flex;
            flex-direction: column;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden; /* Prevent container scrolling */
        }
        
        /* Ensure chat interface fills remaining height and allows inner scrolling */
        #chat-interface {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0; /* Required so children can shrink and scroll */
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
        }
        
        .user-info {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .status-bar {
            background-color: #e8f4fd;
            border-bottom: 1px solid #d1ecf1;
            padding: 10px 20px;
            font-size: 14px;
            color: #0c5460;
            min-height: 20px;
            flex-shrink: 0;
        }
        
        .status-bar.error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .status-bar.ready {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        
        .channel-section {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 15px 20px;
            flex-shrink: 0;
        }
        
        .channel-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .channel-input-group label {
            font-weight: 500;
            color: #495057;
            min-width: 60px;
        }
        
        .channel-input-group input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .channel-input-group input:focus {
            outline: none;
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: #0056b3;
        }
        
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            background-color: #1e7e34;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            background-color: #ffffff;
            min-height: 0; /* Important for flex child to shrink */
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message.own {
            background-color: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .message.other {
            background-color: #f1f3f4;
            color: #333;
        }
        
        .message.history {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            font-style: italic;
        }
        
        .message.system {
            background-color: #e2e3e5;
            color: #6c757d;
            text-align: center;
            font-style: italic;
            margin: 10px auto;
            max-width: 60%;
        }
        
        .message-header {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .message-content {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .message-input-section {
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
            padding: 15px 20px;
            flex-shrink: 0;
            position: sticky;
            bottom: 0;
            z-index: 1;
        }
        
        .message-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .message-input-group input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        
        .message-input-group input:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        
        .message-input-group button {
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="header">
            <h1>Logos Chat</h1>
            <div class="user-info" id="user-info">Connecting...</div>
        </div>
        
        <!-- Status Bar -->
        <div class="status-bar" id="status-bar">Initializing chat application...</div>
        
        <!-- Loading Screen -->
        <div class="loading" id="loading-screen">
            <div class="spinner"></div>
            <div>Connecting to Logos Chat...</div>
        </div>
        
        <!-- Chat Interface (hidden initially) -->
        <div id="chat-interface" class="hidden">
            <!-- Channel Section -->
            <div class="channel-section">
                <div class="channel-input-group">
                    <label for="channel-input">Channel:</label>
                    <input type="text" id="channel-input" placeholder="Enter channel name..." disabled>
                    <button class="btn btn-primary" id="join-btn" disabled>Join</button>
                </div>
            </div>
            
            <!-- Chat Messages -->
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will be added here dynamically -->
            </div>
            
            <!-- Message Input -->
            <div class="message-input-section">
                <div class="message-input-group">
                    <input type="text" id="message-input" placeholder="Type your message..." disabled>
                    <button class="btn btn-success" id="send-btn" disabled>➤</button>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
